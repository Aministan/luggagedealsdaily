name: pages
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: pages
  cancel-in-progress: true
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Build site
        run: python3 scripts/build.py
        env:
          # Project Pages URL is https://aministan.github.io/luggagedealsdaily/
          # For luggagedealsdaily.com later: SITE_URL=https://luggagedealsdaily.com and PATH_PREFIX empty.
          # Do not add a CNAME file until that domain is ready.
          SITE_URL: https://aministan.github.io
          PATH_PREFIX: /luggagedealsdaily
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
